<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="300">

  <title>Yohannes Job Agent</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 24px 30px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .login-box {
      max-width: 420px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.10);
    }

    .login-box h2 {
      margin-top: 0;
    }

    .login-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .login-box button:hover {
      background: #1d4ed8;
    }

    .login-message {
      margin-top: 12px;
      color: #b91c1c;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    .signout {
      border: 0;
      background: #374151;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .stat h2 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .stat p {
      margin: 0;
      color: #6b7280;
    }

    .jobs {
      display: grid;
      gap: 16px;
    }

    .job {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .job h3 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .company {
      color: #4b5563;
      margin-bottom: 12px;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .tag {
      background: #eef2ff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .apply {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 9px 15px;
      border-radius: 6px;
    }

    .application-button {
      background: #111827;
      color: white;
      border: 0;
      padding: 9px 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    .error {
      color: #b91c1c;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      padding: 30px;
      overflow-y: auto;
      z-index: 1000;
    }

    .modal-content {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      border-radius: 12px;
      padding: 30px;
    }

    .modal-content h2 {
      margin-top: 0;
    }

    .close-button {
      float: right;
      border: 0;
      background: #e5e7eb;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .application-section {
      margin-top: 24px;
    }

    .application-section h3 {
      margin-bottom: 8px;
    }

    .application-text {
      white-space: pre-wrap;
      line-height: 1.6;
      background: #f9fafb;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Yohannes Job Agent</h1>
  <p>Fresh matched jobs from your automated job scanner</p>
</header>

<div id="loginSection" class="container">

  <div class="login-box">

    <h2>Sign in</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Sign In
    </button>

    <div id="loginMessage" class="login-message"></div>

  </div>

</div>


<div id="dashboardSection" class="container" style="display:none;">

  <div class="dashboard-header">

    <div>
      <h2>Matched Jobs</h2>
      <p id="userEmail"></p>
    </div>

    <button id="signOutButton" class="signout">
      Sign Out
    </button>

  </div>


  <div class="stats">

    <div class="stat">
      <h2 id="jobCount">0</h2>
      <p>Jobs Found</p>
    </div>

    <div class="stat">
      <h2 id="matchCount">0</h2>
      <p>Matches</p>
    </div>

    <div class="stat">
      <h2 id="remoteCount">0</h2>
      <p>Remote</p>
    </div>

    <div class="stat">
      <h2 id="contractCount">0</h2>
      <p>Contract</p>
    </div>

  </div>


  <div id="jobs" class="jobs">

    <div class="loading">
      Loading jobs...
    </div>

  </div>

</div>


<div id="applicationModal" class="modal">

  <div class="modal-content">

    <button
      id="closeModal"
      class="close-button"
    >
      Close
    </button>

    <h2 id="applicationTitle">
      Application
    </h2>

    <div class="application-section">

      <h3>Status</h3>

      <div
        id="applicationStatus"
        class="application-text"
      ></div>

    </div>


    <div class="application-section">

      <h3>Resume Version</h3>

      <div
        id="resumeVersion"
        class="application-text"
      ></div>

    </div>


    <div class="application-section">

      <h3>Cover Letter</h3>

      <div
        id="coverLetter"
        class="application-text"
      ></div>

    </div>


    <div class="application-section">

      <h3>Application Answers</h3>

      <div
        id="applicationAnswers"
        class="application-text"
      ></div>

    </div>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://bovpcfirhvpocurjtnts.supabase.co";


  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_d0PyV9AKpla2LSY875R3dQ_BBJo_zjG";


  const SUPABASE_AUTH_URL =
    SUPABASE_URL + "/auth/v1";


  const loginSection =
    document.getElementById("loginSection");


  const dashboardSection =
    document.getElementById("dashboardSection");


  const loginButton =
    document.getElementById("loginButton");


  const signOutButton =
    document.getElementById("signOutButton");


  const loginMessage =
    document.getElementById("loginMessage");


  const jobsContainer =
    document.getElementById("jobs");


  const userEmail =
    document.getElementById("userEmail");


  const applicationModal =
    document.getElementById("applicationModal");


  const closeModal =
    document.getElementById("closeModal");


  const applicationTitle =
    document.getElementById("applicationTitle");


  const applicationStatus =
    document.getElementById("applicationStatus");


  const resumeVersion =
    document.getElementById("resumeVersion");


  const coverLetter =
    document.getElementById("coverLetter");


  const applicationAnswers =
    document.getElementById("applicationAnswers");


  const jobCount =
    document.getElementById("jobCount");


  const matchCount =
    document.getElementById("matchCount");


  const remoteCount =
    document.getElementById("remoteCount");


  const contractCount =
    document.getElementById("contractCount");


  let accessToken = null;


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function showDashboard(user) {

    accessToken = user.access_token;

    loginSection.style.display = "none";

    dashboardSection.style.display = "block";

    userEmail.textContent =
      user.email || "";

    loadJobs();

  }


  async function signIn() {

    loginMessage.textContent = "";

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if (!email || !password) {

      loginMessage.textContent =
        "Enter your email and password.";

      return;

    }


    loginButton.disabled = true;

    loginButton.textContent = "Signing in...";


    try {

      const response =
        await fetch(
          SUPABASE_AUTH_URL +
          "/token?grant_type=password",
          {
            method: "POST",

            headers: {
              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.msg ||
          data.error_description ||
          data.message ||
          "Sign in failed."
        );

      }


      showDashboard({
        access_token:
          data.access_token,

        email:
          email
      });


    } catch (error) {

      loginMessage.textContent =
        error.message;

    } finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "Sign In";

    }

  }


  async function signOut() {

    if (accessToken) {

      try {

        await fetch(
          SUPABASE_AUTH_URL +
          "/logout",

          {
            method: "POST",

            headers: {
              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                "Bearer " + accessToken
            }
          }
        );

      } catch (error) {

        console.error(error);

      }

    }


    accessToken = null;

    dashboardSection.style.display =
      "none";

    loginSection.style.display =
      "block";

    document.getElementById("password").value =
      "";

  }


  function formatSalary(job) {

    if (job.salary_min == null) {

      return "Salary not listed";

    }


    const min =
      Number(job.salary_min)
        .toLocaleString();


    const max =
      job.salary_max != null
        ? Number(job.salary_max)
            .toLocaleString()
        : null;


    if (job.salary_period === "hour") {

      return max
        ? "$" + min + " - $" + max + "/hr"
        : "$" + min + "/hr";

    }


    return max
      ? "$" + min + " - $" + max + "/year"
      : "$" + min + "/year";

  }


  function renderJobs(jobs) {

    jobCount.textContent =
      jobs.length;

    matchCount.textContent =
      jobs.length;


    remoteCount.textContent =
      jobs.filter(
        job => job.work_type === "remote"
      ).length;


    contractCount.textContent =
      jobs.filter(
        job => job.employment_type === "contract"
      ).length;


    if (!jobs.length) {

      jobsContainer.innerHTML = `

        <div class="job">

          <h3>No matched jobs yet</h3>

          <p>
            The scanner will add jobs automatically.
          </p>

        </div>

      `;

      return;

    }


    jobsContainer.innerHTML =
      jobs.map(job => {

        const applyUrl =
          job.application_url ||
          job.job_url ||
          "#";


        return `

          <div class="job">

            <h3>
              ${escapeHtml(
                job.title ||
                "Untitled Job"
              )}
            </h3>


            <div class="company">

              ${escapeHtml(
                job.company_name ||
                "Company"
              )}

            </div>


            <div class="details">

              <span class="tag">
                ${escapeHtml(
                  job.work_type ||
                  "Unknown"
                )}
              </span>


              <span class="tag">
                ${escapeHtml(
                  job.employment_type ||
                  "Unknown"
                )}
              </span>


              <span class="tag">
                ${escapeHtml(
                  job.location_text ||
                  "Location not listed"
                )}
              </span>


              <span class="tag">
                ${escapeHtml(
                  formatSalary(job)
                )}
              </span>


              <span class="tag">
                Match:
                ${escapeHtml(
                  job.match_score ??
                  "N/A"
                )}
              </span>


              <span class="tag">
                Application:
                ${escapeHtml(
                  job.application_status ||
                  "not prepared"
                )}
              </span>

            </div>


            <div class="button-row">

              <a
                class="apply"
                href="${escapeHtml(
                  applyUrl
                )}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Apply
              </a>


              <button
                class="application-button"
                onclick="viewApplication('${escapeHtml(
                  job.job_id
                )}', '${escapeHtml(
                  job.title || ""
                )}')"
              >
                View Application
              </button>

            </div>

          </div>

        `;

      }).join("");

  }


  async function loadJobs() {

    jobsContainer.innerHTML = `

      <div class="loading">
        Loading matched jobs...
      </div>

    `;


    const endpoint =

      SUPABASE_URL +

      "/rest/v1/job_feed_public" +

      "?select=*" +

      "&order=posted_at.desc" +

      "&limit=100";


    try {

      const response =

        await fetch(
          endpoint,
          {
            method: "GET",

            headers: {

              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_PUBLISHABLE_KEY,

              "Accept":
                "application/json"

            }

          }
        );


      const body =
        await response.text();


      if (!response.ok) {

        throw new Error(
          "Supabase error " +
          response.status +
          ": " +
          body
        );

      }


      const jobs =
        body
          ? JSON.parse(body)
          : [];


      renderJobs(jobs);


    } catch (error) {

      jobsContainer.innerHTML = `

        <div class="job">

          <h3 class="error">
            Could not load jobs
          </h3>

          <p>
            ${escapeHtml(
              error.message
            )}
          </p>

        </div>

      `;

    }

  }


  async function viewApplication(
    jobId,
    title
  ) {

    applicationTitle.textContent =
      title || "Application";


    applicationStatus.textContent =
      "Loading...";


    resumeVersion.textContent =
      "";


    coverLetter.textContent =
      "";


    applicationAnswers.textContent =
      "";


    applicationModal.style.display =
      "block";


    const endpoint =

      SUPABASE_URL +

      "/rest/v1/applications" +

      "?job_id=eq." +

      encodeURIComponent(jobId) +

      "&select=status,resume_version,cover_letter,application_answers";


    try {

      const response =

        await fetch(
          endpoint,
          {
            method: "GET",

            headers: {

              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                "Bearer " +
                accessToken,

              "Accept":
                "application/json",

              "Accept-Profile":
                "public"

            }

          }
        );


      const body =
        await response.text();


      if (!response.ok) {

        throw new Error(
          body
        );

      }


      const data =
        body
          ? JSON.parse(body)
          : [];


      if (!data.length) {

        throw new Error(
          "Application package not found."
        );

      }


      const app =
        data[0];


      applicationStatus.textContent =
        app.status ||
        "N/A";


      resumeVersion.textContent =
        app.resume_version ||
        "N/A";


      coverLetter.textContent =
        app.cover_letter ||
        "Not available";


      applicationAnswers.textContent =

        JSON.stringify(
          app.application_answers ||
          {},
          null,
          2
        );


    } catch (error) {

      applicationStatus.textContent =
        "Could not load application.";

      coverLetter.textContent =
        error.message;

    }

  }


  loginButton.addEventListener(
    "click",
    signIn
  );


  signOutButton.addEventListener(
    "click",
    signOut
  );


  closeModal.addEventListener(
    "click",
    () => {
      applicationModal.style.display =
        "none";
    }
  );


  applicationModal.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        applicationModal
      ) {

        applicationModal.style.display =
          "none";

      }

    }
  );

</script>

</body>
</html>
