<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="300">

  <title>Yohannes Job Agent</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 24px 30px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .login-box {
      max-width: 420px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.10);
    }

    .login-box h2 {
      margin-top: 0;
    }

    .login-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .login-box button:hover {
      background: #1d4ed8;
    }

    .login-message {
      margin-top: 12px;
      color: #b91c1c;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    .signout {
      border: 0;
      background: #374151;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .stat h2 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .stat p {
      margin: 0;
      color: #6b7280;
    }

    .jobs {
      display: grid;
      gap: 16px;
    }

    .job {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .job h3 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .company {
      color: #4b5563;
      margin-bottom: 12px;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .tag {
      background: #eef2ff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
    }

    .status-prepared {
      background: #eef2ff;
    }

    .status-applied {
      background: #ecfdf5;
    }

    .status-interview {
      background: #fff7ed;
    }

    .status-rejected {
      background: #fef2f2;
    }

    .status-offer {
      background: #f0fdf4;
    }

    .status-withdrawn {
      background: #f3f4f6;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .apply,
    .application-button,
    .copy-button,
    .save-button {
      padding: 9px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      border: 0;
      text-decoration: none;
      display: inline-block;
    }

    .apply {
      background: #2563eb;
      color: white;
    }

    .application-button {
      background: #111827;
      color: white;
    }

    .copy-button {
      background: #e5e7eb;
      color: #111827;
    }

    .save-button {
      background: #16a34a;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    .error {
      color: #b91c1c;
    }

    .success {
      color: #15803d;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      padding: 30px;
      overflow-y: auto;
      z-index: 1000;
    }

    .modal-content {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      border-radius: 12px;
      padding: 30px;
    }

    .modal-content h2 {
      margin-top: 0;
    }

    .close-button {
      float: right;
      border: 0;
      background: #e5e7eb;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .application-section {
      margin-top: 24px;
    }

    .application-section h3 {
      margin-bottom: 8px;
    }

    .application-text {
      white-space: pre-wrap;
      line-height: 1.6;
      background: #f9fafb;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    .answer-grid {
      display: grid;
      gap: 14px;
    }

    .answer-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
    }

    .answer-card h4 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #111827;
    }

    .answer-value {
      white-space: pre-wrap;
      line-height: 1.6;
      color: #374151;
    }

    .skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill {
      background: #eef2ff;
      color: #1f2937;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
    }

    .answer-note {
      color: #6b7280;
      font-size: 13px;
      margin-top: 8px;
    }

    .status-control {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .status-control select {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      background: white;
    }

    .status-message {
      margin-top: 10px;
      font-size: 14px;
    }

    @media (max-width: 1000px) {
      .stats {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .modal {
        padding: 10px;
      }

      .modal-content {
        margin: 10px auto;
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Yohannes Job Agent</h1>
  <p>Fresh matched jobs from your automated job scanner</p>
</header>

<div id="loginSection" class="container">

  <div class="login-box">

    <h2>Sign in</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Sign In
    </button>

    <div id="loginMessage" class="login-message"></div>

  </div>

</div>

<div id="dashboardSection" class="container" style="display:none;">

  <div class="dashboard-header">

    <div>
      <h2>Matched Jobs</h2>
      <p id="userEmail"></p>
    </div>

    <button id="signOutButton" class="signout">
      Sign Out
    </button>

  </div>

  <div class="stats">

    <div class="stat">
      <h2 id="jobCount">0</h2>
      <p>Jobs Found</p>
    </div>

    <div class="stat">
      <h2 id="matchCount">0</h2>
      <p>Matches</p>
    </div>

    <div class="stat">
      <h2 id="remoteCount">0</h2>
      <p>Remote</p>
    </div>

    <div class="stat">
      <h2 id="contractCount">0</h2>
      <p>Contract</p>
    </div>

    <div class="stat">
      <h2 id="appliedCount">0</h2>
      <p>Applied</p>
    </div>

  </div>

  <div id="jobs" class="jobs">

    <div class="loading">
      Loading jobs...
    </div>

  </div>

</div>

<div id="applicationModal" class="modal">

  <div class="modal-content">

    <button
      id="closeModal"
      class="close-button"
    >
      Close
    </button>

    <h2 id="applicationTitle">
      Application
    </h2>

    <div class="application-section">

      <h3>Application Status</h3>

      <div class="status-control">

        <select id="applicationStatusSelect">

          <option value="prepared">
            Prepared
          </option>

          <option value="applied">
            Applied
          </option>

          <option value="interview">
            Interview
          </option>

          <option value="rejected">
            Rejected
          </option>

          <option value="offer">
            Offer
          </option>

          <option value="withdrawn">
            Withdrawn
          </option>

        </select>

        <button
          id="saveStatusButton"
          class="save-button"
        >
          Save Status
        </button>

      </div>

      <div
        id="statusMessage"
        class="status-message"
      ></div>

    </div>

    <div class="application-section">

      <h3>Resume Version</h3>

      <div
        id="resumeVersion"
        class="application-text"
      ></div>

    </div>

    <div class="application-section">

      <h3>Cover Letter</h3>

      <div class="button-row">

        <button
          id="copyCoverLetterButton"
          class="copy-button"
        >
          Copy Cover Letter
        </button>

      </div>

      <br>

      <div
        id="coverLetter"
        class="application-text"
      ></div>

    </div>

    <div class="application-section">

      <h3>Application Answers</h3>

      <div class="button-row">

        <button
          id="copyAnswersButton"
          class="copy-button"
        >
          Copy Answers
        </button>

      </div>

      <br>

      <div
        id="applicationAnswers"
        class="answer-grid"
      ></div>

    </div>

  </div>

</div>

<script>

  const SUPABASE_URL =
    "https://bovpcfirhvpocurjtnts.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_d0PyV9AKpla2LSY875R3dQ_BBJo_zjG";

  const SUPABASE_AUTH_URL =
    SUPABASE_URL + "/auth/v1";

  const loginSection =
    document.getElementById("loginSection");

  const dashboardSection =
    document.getElementById("dashboardSection");

  const loginButton =
    document.getElementById("loginButton");

  const signOutButton =
    document.getElementById("signOutButton");

  const loginMessage =
    document.getElementById("loginMessage");

  const jobsContainer =
    document.getElementById("jobs");

  const userEmail =
    document.getElementById("userEmail");

  const applicationModal =
    document.getElementById("applicationModal");

  const closeModal =
    document.getElementById("closeModal");

  const applicationTitle =
    document.getElementById("applicationTitle");

  const applicationStatusSelect =
    document.getElementById(
      "applicationStatusSelect"
    );

  const saveStatusButton =
    document.getElementById(
      "saveStatusButton"
    );

  const statusMessage =
    document.getElementById(
      "statusMessage"
    );

  const resumeVersion =
    document.getElementById(
      "resumeVersion"
    );

  const coverLetter =
    document.getElementById(
      "coverLetter"
    );

  const applicationAnswers =
    document.getElementById(
      "applicationAnswers"
    );

  const copyCoverLetterButton =
    document.getElementById(
      "copyCoverLetterButton"
    );

  const copyAnswersButton =
    document.getElementById(
      "copyAnswersButton"
    );

  const jobCount =
    document.getElementById(
      "jobCount"
    );

  const matchCount =
    document.getElementById(
      "matchCount"
    );

  const remoteCount =
    document.getElementById(
      "remoteCount"
    );

  const contractCount =
    document.getElementById(
      "contractCount"
    );

  const appliedCount =
    document.getElementById(
      "appliedCount"
    );

  let accessToken = null;

  let currentJobId = null;

  let currentCoverLetter = "";

  let currentAnswersText = "";


  function escapeHtml(value) {

    return String(value ?? "")

      .replaceAll("&", "&amp;")

      .replaceAll("<", "&lt;")

      .replaceAll(">", "&gt;")

      .replaceAll('"', "&quot;")

      .replaceAll("'", "&#039;");

  }


  function statusLabel(status) {

    const labels = {

      prepared: "Prepared",

      applied: "Applied",

      interview: "Interview",

      rejected: "Rejected",

      offer: "Offer",

      withdrawn: "Withdrawn"

    };

    return labels[status] ||
      status ||
      "Prepared";

  }


  function showDashboard(user) {

    accessToken =
      user.access_token;

    loginSection.style.display =
      "none";

    dashboardSection.style.display =
      "block";

    userEmail.textContent =
      user.email || "";

    loadJobs();

  }


  async function signIn() {

    loginMessage.textContent =
      "";

    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;


    if (!email || !password) {

      loginMessage.textContent =
        "Enter your email and password.";

      return;

    }


    loginButton.disabled =
      true;

    loginButton.textContent =
      "Signing in...";


    try {

      const response =
        await fetch(

          SUPABASE_AUTH_URL +
          "/token?grant_type=password",

          {

            method: "POST",

            headers: {

              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              email,
              password

            })

          }

        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(

          data.msg ||

          data.error_description ||

          data.message ||

          "Sign in failed."

        );

      }


      showDashboard({

        access_token:
          data.access_token,

        email

      });


    } catch (error) {

      loginMessage.textContent =
        error.message;

    } finally {

      loginButton.disabled =
        false;

      loginButton.textContent =
        "Sign In";

    }

  }


  async function signOut() {

    if (accessToken) {

      try {

        await fetch(

          SUPABASE_AUTH_URL +
          "/logout",

          {

            method: "POST",

            headers: {

              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                "Bearer " +
                accessToken

            }

          }

        );

      } catch (error) {

        console.error(error);

      }

    }


    accessToken =
      null;

    dashboardSection.style.display =
      "none";

    loginSection.style.display =
      "block";

    document.getElementById(
      "password"
    ).value = "";

  }


  function formatSalary(job) {

    if (job.salary_min == null) {

      return "Salary not listed";

    }


    const min =
      Number(job.salary_min)
        .toLocaleString();


    const max =
      job.salary_max != null

        ? Number(job.salary_max)
            .toLocaleString()

        : null;


    if (job.salary_period === "hour") {

      return max

        ? "$" +
          min +
          " - $" +
          max +
          "/hr"

        : "$" +
          min +
          "/hr";

    }


    return max

      ? "$" +
        min +
        " - $" +
        max +
        "/year"

      : "$" +
        min +
        "/year";

  }


  function renderJobs(jobs) {

    jobCount.textContent =
      jobs.length;

    matchCount.textContent =
      jobs.length;


    remoteCount.textContent =

      jobs.filter(

        job =>
          job.work_type === "remote"

      ).length;


    contractCount.textContent =

      jobs.filter(

        job =>
          job.employment_type ===
          "contract"

      ).length;


    appliedCount.textContent =

      jobs.filter(

        job =>
          job.application_status ===
          "applied"

      ).length;


    if (!jobs.length) {

      jobsContainer.innerHTML = `

        <div class="job">

          <h3>
            No matched jobs yet
          </h3>

          <p>
            The scanner will add jobs automatically.
          </p>

        </div>

      `;

      return;

    }


    jobsContainer.innerHTML =

      jobs.map(job => {

        const applyUrl =

          job.application_url ||

          job.job_url ||

          "#";


        const status =

          job.application_status ||

          "prepared";


        const statusClass =

          "status-" +
          status;


        return `

          <div class="job">

            <h3>
              ${escapeHtml(
                job.title ||
                "Untitled Job"
              )}
            </h3>


            <div class="company">

              ${escapeHtml(
                job.company_name ||
                "Company"
              )}

            </div>


            <div class="details">

              <span class="tag">

                ${escapeHtml(
                  job.work_type ||
                  "Unknown"
                )}

              </span>


              <span class="tag">

                ${escapeHtml(
                  job.employment_type ||
                  "Unknown"
                )}

              </span>


              <span class="tag">

                ${escapeHtml(
                  job.location_text ||
                  "Location not listed"
                )}

              </span>


              <span class="tag">

                ${escapeHtml(
                  formatSalary(job)
                )}

              </span>


              <span class="tag">

                Match:
                ${escapeHtml(
                  job.match_score ??
                  "N/A"
                )}

              </span>


              <span
                class="tag ${statusClass}"
              >

                Status:
                ${escapeHtml(
                  statusLabel(status)
                )}

              </span>

            </div>


            <div class="button-row">

              <a

                class="apply"

                href="${escapeHtml(
                  applyUrl
                )}"

                target="_blank"

                rel="noopener noreferrer"

              >

                Apply

              </a>


              <button

                class="application-button"

                onclick="viewApplication(
                  '${escapeHtml(job.job_id)}',
                  '${escapeHtml(job.title || "")}'
                )"

              >

                View Application

              </button>

            </div>

          </div>

        `;

      }).join("");

  }


  async function loadJobs() {

    jobsContainer.innerHTML = `

      <div class="loading">

        Loading matched jobs...

      </div>

    `;


    const endpoint =

      SUPABASE_URL +

      "/rest/v1/job_feed_public" +

      "?select=*" +

      "&order=posted_at.desc" +

      "&limit=100";


    try {

      const response =

        await fetch(

          endpoint,

          {

            method: "GET",

            headers: {

              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_PUBLISHABLE_KEY,

              "Accept":
                "application/json"

            }

          }

        );


      const body =
        await response.text();


      if (!response.ok) {

        throw new Error(

          "Supabase error " +
          response.status +
          ": " +
          body

        );

      }


      const jobs =
        body
          ? JSON.parse(body)
          : [];


      renderJobs(jobs);


    } catch (error) {

      jobsContainer.innerHTML = `

        <div class="job">

          <h3 class="error">

            Could not load jobs

          </h3>

          <p>

            ${escapeHtml(
              error.message
            )}

          </p>

        </div>

      `;

    }

  }


  function renderApplicationAnswers(
    payload
  ) {

    const answers =

      payload &&
      payload.answers

        ? payload.answers

        : {};


    const keySkills =

      Array.isArray(
        answers.key_skills
      )

        ? answers.key_skills

        : [];


    const matchedSkills =

      Array.isArray(
        payload?.matched_skills
      )

        ? payload.matched_skills

        : [];


    const sections = [];


    if (keySkills.length) {

      sections.push(`

        <div class="answer-card">

          <h4>
            Key Skills
          </h4>

          <div class="skill-list">

            ${keySkills.map(skill =>

              `<span class="skill">
                ${escapeHtml(skill)}
              </span>`

            ).join("")}

          </div>

        </div>

      `);

    }


    if (matchedSkills.length) {

      sections.push(`

        <div class="answer-card">

          <h4>
            Matched Skills
          </h4>

          <div class="skill-list">

            ${matchedSkills.map(skill =>

              `<span class="skill">
                ${escapeHtml(skill)}
              </span>`

            ).join("")}

          </div>

        </div>

      `);

    }


    const textSections = [

      [
        "Work Authorization",
        answers.authorization
      ],

      [
        "Why are you interested?",
        answers.why_interested
      ],

      [
        "Relevant Experience",
        answers.relevant_experience
      ]

    ];


    textSections.forEach(

      ([label, value]) => {

        if (value) {

          sections.push(`

            <div class="answer-card">

              <h4>
                ${escapeHtml(label)}
              </h4>

              <div class="answer-value">
                ${escapeHtml(value)}
              </div>

            </div>

          `);

        }

      }

    );


    applicationAnswers.innerHTML =

      sections.length

        ? sections.join("")

        : `

          <div class="answer-card">

            <div class="answer-value">

              No structured application answers available.

            </div>

            <div class="answer-note">

              The application package was created,
              but no answer fields were found.

            </div>

          </div>

        `;


    currentAnswersText = [

      keySkills.length

        ? "Key Skills:\n" +
          keySkills.join(", ")

        : "",


      matchedSkills.length

        ? "Matched Skills:\n" +
          matchedSkills.join(", ")

        : "",


      answers.authorization

        ? "Work Authorization:\n" +
          answers.authorization

        : "",


      answers.why_interested

        ? "Why are you interested?:\n" +
          answers.why_interested

        : "",


      answers.relevant_experience

        ? "Relevant Experience:\n" +
          answers.relevant_experience

        : ""

    ]

      .filter(Boolean)

      .join("\n\n");

  }


  async function viewApplication(
    jobId,
    title
  ) {

    currentJobId =
      jobId;


    statusMessage.textContent =
      "";


    applicationTitle.textContent =
      title ||
      "Application";


    applicationStatusSelect.value =
      "prepared";


    resumeVersion.textContent =
      "Loading...";


    coverLetter.textContent =
      "Loading...";


    applicationAnswers.innerHTML = `

      <div class="answer-card">

        <div class="answer-value">

          Loading application answers...

        </div>

      </div>

    `;


    applicationModal.style.display =
      "block";


    const endpoint =

      SUPABASE_URL +

      "/rest/v1/applications" +

      "?job_id=eq." +

      encodeURIComponent(jobId) +

      "&select=status,resume_version,cover_letter,application_answers";


    try {

      const response =

        await fetch(

          endpoint,

          {

            method: "GET",

            headers: {

              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                "Bearer " +
                accessToken,

              "Accept":
                "application/json",

              "Accept-Profile":
                "public"

            }

          }

        );


      const body =
        await response.text();


      if (!response.ok) {

        throw new Error(body);

      }


      const data =

        body

          ? JSON.parse(body)

          : [];


      if (!data.length) {

        throw new Error(
          "Application package not found."
        );

      }


      const app =
        data[0];


      applicationStatusSelect.value =

        app.status ||
        "prepared";


      resumeVersion.textContent =

        app.resume_version ||
        "N/A";


      currentCoverLetter =
        app.cover_letter || "";


      coverLetter.textContent =

        currentCoverLetter ||
        "Not available";


      renderApplicationAnswers(

        app.application_answers ||
        {}

      );


    } catch (error) {

      applicationStatusSelect.value =
        "prepared";


      resumeVersion.textContent =
        "N/A";


      coverLetter.textContent =
        error.message;


      applicationAnswers.innerHTML = `

        <div class="answer-card">

          <div class="answer-value">

            Application answers could not be loaded.

          </div>

        </div>

      `;

    }

  }


  async function saveApplicationStatus() {

    if (!currentJobId) {

      return;

    }


    const newStatus =

      applicationStatusSelect.value;


    saveStatusButton.disabled =
      true;

    saveStatusButton.textContent =
      "Saving...";

    statusMessage.textContent =
      "";


    try {

      const endpoint =

        SUPABASE_URL +

        "/rest/v1/applications" +

        "?job_id=eq." +

        encodeURIComponent(
          currentJobId
        );


      const response =

        await fetch(

          endpoint,

          {

            method: "PATCH",

            headers: {

              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                "Bearer " +
                accessToken,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"

            },

            body: JSON.stringify({

              status:
                newStatus

            })

          }

        );


      const body =
        await response.text();


      if (!response.ok) {

        throw new Error(

          "Could not save status: " +
          body

        );

      }


      statusMessage.textContent =

        "Status saved: " +
        statusLabel(newStatus);

      statusMessage.className =
        "status-message success";


      await loadJobs();


    } catch (error) {

      statusMessage.textContent =
        error.message;

      statusMessage.className =
        "status-message error";

    } finally {

      saveStatusButton.disabled =
        false;

      saveStatusButton.textContent =
        "Save Status";

    }

  }


  async function copyText(
    textToCopy,
    button,
    successText
  ) {

    if (!textToCopy) {

      return;

    }


    try {

      await navigator.clipboard.writeText(
        textToCopy
      );

      const oldText =
        button.textContent;

      button.textContent =
        successText;

      setTimeout(() => {

        button.textContent =
          oldText;

      }, 1500);


    } catch (error) {

      alert(
        "Copy failed. Please select and copy the text manually."
      );

    }

  }


  loginButton.addEventListener(
    "click",
    signIn
  );


  signOutButton.addEventListener(
    "click",
    signOut
  );


  saveStatusButton.addEventListener(
    "click",
    saveApplicationStatus
  );


  copyCoverLetterButton.addEventListener(
    "click",
    () => {

      copyText(

        currentCoverLetter,

        copyCoverLetterButton,

        "Copied!"

      );

    }
  );


  copyAnswersButton.addEventListener(
    "click",
    () => {

      copyText(

        currentAnswersText,

        copyAnswersButton,

        "Copied!"

      );

    }
  );


  document
    .getElementById("password")
    .addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          signIn();

        }

      }
    );


  closeModal.addEventListener(

    "click",

    () => {

      applicationModal.style.display =
        "none";

    }

  );


  applicationModal.addEventListener(

    "click",

    event => {

      if (
        event.target ===
        applicationModal
      ) {

        applicationModal.style.display =
          "none";

      }

    }

  );

</script>

</body>
</html>
